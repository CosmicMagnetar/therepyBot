<!DOCTYPE html>
<html>
<head>
  <title>TherapyBot</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chat { max-width: 500px; margin: auto; overflow-y: auto; height: 400px; border: 1px solid #ccc; padding: 10px; }
    .message { margin: 5px 0; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <div id="chat">
    <div class="message bot">TherapyBot: Hello! I'm here to listen and support you.</div>
  </div>
  <input id="message" type="text" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const message = input.value.trim();
      if (!message) return;

      const chatDiv = document.getElementById("chat");
      chatDiv.innerHTML += `<div class="message user">You: ${message}</div>`;

      try {
        const response = await fetch("https://therepybot.onrender.com/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        const botMsg = data.response || data.error || "Sorry, no response from server.";
        chatDiv.innerHTML += `<div class="message bot">TherapyBot: ${botMsg}</div>`;
      } catch (err) {
        console.error("Error:", err);
        chatDiv.innerHTML += `<div class="message bot">TherapyBot: Sorry, I'm having trouble connecting.</div>`;
      }

      input.value = "";
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
  </script>
</body>
</html>
